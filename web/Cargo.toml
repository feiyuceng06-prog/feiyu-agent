[package]
name = "feiyu-web"
version = "0.51.1"
edition = "2024"
description = "feiyu 的网页端：HTTP + WebSocket 服务，监管一个 feiyu --serve 子进程"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[profile.release]
# 单文件分发，体积比编译时间重要
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
