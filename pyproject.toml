[project]
name = "feiyu-agent"
dynamic = ["version"]
description = "A minimal terminal coding agent for Claude, DeepSeek, and Kimi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pillow>=9",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# 只有用 DeepSeek / Kimi 时才需要
openai = ["openai>=1.30"]

[project.scripts]
feiyu = "feiyu.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feiyu"]

# 版本号只写在 feiyu/__init__.py，这里读过来，免得两处漂移
[tool.setuptools.dynamic]
version = { attr = "feiyu.__version__" }

[tool.setuptools.package-data]
feiyu = ["logo.png"]
