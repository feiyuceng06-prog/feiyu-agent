[project]
name = "feiyu-agent"
dynamic = ["version"]
description = "A minimal terminal coding agent for Claude, DeepSeek, and Kimi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 下限是真跑过全套用例的那一版：`output_config.effort` / adaptive thinking 老的 SDK 不认，
# 装上去不报版本冲突，第一轮请求才 TypeError
dependencies = [
    "anthropic>=1.5",
    "pillow>=9",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# 用 OpenRouter / DeepSeek / Kimi 这些 openai 兼容接口时才需要
openai = ["openai>=3.14"]

[project.scripts]
feiyu = "feiyu.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feiyu"]

# 版本号只写在 feiyu/__init__.py，这里读过来，免得两处漂移
[tool.setuptools.dynamic]
version = { attr = "feiyu.__version__" }

[tool.setuptools.package-data]
feiyu = ["logo.png"]
