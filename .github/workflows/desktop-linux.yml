name: Build Linux desktop
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libsecret-1-0 xvfb
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python3 scripts/build_backend.py
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: xvfb-run -a npm run test:desktop
        working-directory: desktop
      - run: npm run dist:linux
        working-directory: desktop
      - name: Test packaged application
        working-directory: desktop
        run: FEIYU_TEST_EXECUTABLE="$PWD/release/linux-unpacked/feiyu-desktop" xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: feiyu-linux-x64
          path: |
            desktop/release/*.deb
            desktop/release/*.AppImage
            desktop/test-results/workbench.png

  # 打 desktop-v* 标签时把上面那两个包挂到 Releases 上，没有 GitHub 账号也下得到。
  # 单独一个 job：只有它要写权限，装依赖、跑测试那些步骤拿到的 token 照旧是只读的
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feiyu-linux-x64
          path: built
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" built/release/*.deb built/release/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --title "Feiyu ${TAG#desktop-v}（Linux）" \
            --notes "Ubuntu 上用 deb：sudo apt install ./文件名.deb。AppImage：chmod +x 之后双击；它要 libfuse2，Ubuntu 22.04 起默认不装，先 sudo apt install libfuse2（24.04 是 libfuse2t64）。第一次打开时按「连接模型」，选个接口、贴上 key 就能用。"
