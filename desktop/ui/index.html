<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Feiyu</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-side="on">

<!-- 无边框窗口自己的缩放热区。八个方向各一条，宽 6px，压在最上层。
     系统不给缩放边框了，不做这个窗口就只能是启动时那个尺寸。 -->
<div class="grips" aria-hidden="true">
  <i data-dir="North"></i><i data-dir="South"></i><i data-dir="West"></i><i data-dir="East"></i>
  <i data-dir="NorthWest"></i><i data-dir="NorthEast"></i>
  <i data-dir="SouthWest"></i><i data-dir="SouthEast"></i>
</div>

<!-- 自绘标题栏。整条可拖动，按钮那几块单独排除掉。 -->
<header class="bar" data-tauri-drag-region>
  <div class="bar__left">
    <button id="side-toggle" class="chip" type="button" title="收起 / 展开侧边栏"
            aria-expanded="true" aria-controls="side">◧</button>
    <img class="bar__mark" src="logo.svg" alt="" width="18" height="18">
    <span class="bar__title">Feiyu</span>
  </div>
  <!-- 中间这块什么都不放，专门用来拖窗口：子元素会把父元素的 drag region 挡住，
       光在 <header> 上写 data-tauri-drag-region 是不够的 -->
  <div class="bar__drag" data-tauri-drag-region></div>
  <div class="bar__right">
    <button id="act-term" class="chip" type="button" title="终端面板　Ctrl `">▮</button>
    <span class="bar__sep"></span>
    <button id="win-min" class="win win--min" type="button" aria-label="最小化"></button>
    <button id="win-max" class="win win--max" type="button" aria-label="最大化"></button>
    <button id="win-close" class="win win--close" type="button" aria-label="关闭"></button>
  </div>
</header>

<aside class="side" id="side">
  <button class="desk" id="desk" type="button" title="切换工作台">
    <span class="desk__label">工作台</span>
    <span class="desk__path mono" id="desk-path">—</span>
  </button>
  <ul class="desks" id="desks" hidden></ul>

  <nav class="side__nav">
    <button class="nav" id="new-talk" type="button">
      <span class="nav__icon">＋</span><span class="nav__text">新建会话</span>
      <span class="nav__key">Ctrl N</span>
    </button>
    <button class="nav" id="nav-shelf" type="button" aria-pressed="false">
      <span class="nav__icon">◇</span><span class="nav__text">技能与工具</span>
      <span class="nav__key">Ctrl K</span>
    </button>
  </nav>

  <div class="side__find">
    <input id="find" type="search" placeholder="搜索会话…" spellcheck="false" autocomplete="off">
  </div>

  <div class="side__scroll">
    <div class="group" id="group-pinned" hidden>
      <div class="group__head">已置顶</div>
      <ul class="talks" id="pinned"></ul>
    </div>
    <div class="group">
      <div class="group__head">会话</div>
      <ul class="talks" id="talks"></ul>
    </div>
  </div>
</aside>

<main class="sheet" id="sheet">
  <div class="stream" id="stream"></div>
</main>

<!-- 技能与工具。跟 .sheet 占同一格，开着的时候把对话那一屏整个换掉 ——
     它是配置不是对话，浮在上面或者挤在旁边都会让人分不清自己在哪儿。 -->
<section class="shelf" id="shelf" hidden>
  <div class="shelf__head">
    <div class="tabs" id="shelf-tabs">
      <button class="tab" data-tab="skills" aria-selected="true">技能<b id="n-skills"></b></button>
      <button class="tab" data-tab="tools" aria-selected="false">工具集<b id="n-tools"></b></button>
      <button class="tab" data-tab="mcp" aria-selected="false">MCP<b id="n-mcp"></b></button>
      <button class="tab" data-tab="profiles" aria-selected="false">档案<b id="n-profiles"></b></button>
    </div>
    <input id="shelf-find" type="search" placeholder="按名字或用途筛…"
           spellcheck="false" autocomplete="off">
  </div>
  <div class="shelf__body">
    <ul class="shelf__list" id="shelf-list"></ul>
    <div class="shelf__pane" id="shelf-pane"></div>
  </div>
  <div class="shelf__foot">
    <span id="shelf-where" class="mono"></span>
    <span class="shelf__hint" id="shelf-hint"></span>
  </div>
</section>

<section class="term" id="term" hidden>
  <div class="term__bar">
    <span class="term__label">终端</span>
    <span class="term__hint">这是你自己的 shell，跟 agent 各跑各的</span>
    <button id="term-close" class="chip" type="button" title="收起">×</button>
  </div>
  <div class="term__body" id="term-body"></div>
</section>

<footer class="composer" id="composer">
  <ul class="clips" id="clips" hidden></ul>
  <div class="palette" id="palette" hidden></div>
  <div class="composer__row">
    <label class="chip chip--attach" title="上传文件到工作区">
      ＋<input id="file" type="file" multiple hidden>
    </label>
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off"
              placeholder="我们要做什么？"></textarea>
    <button id="model" class="pick" type="button" title="切换模型">—</button>
    <button id="send" class="go" type="button" title="发送">→</button>
    <button id="stop" class="go go--stop" type="button" title="中断" hidden>■</button>
  </div>
</footer>

<footer class="status">
  <div class="status__left">
    <span class="dot" id="dot" data-state="off"></span>
    <span id="s-state">连接中</span>
    <span class="status__sep">·</span>
    <span id="s-cwd" class="mono">—</span>
    <span class="status__sep" id="s-boot-sep" hidden>·</span>
    <span id="s-boot" hidden></span>
  </div>
  <div class="status__right">
    <span id="s-mode">—</span>
    <span class="status__sep">·</span>
    <span id="s-ctx" class="mono">—</span>
    <span class="status__sep">·</span>
    <span id="s-cost" class="mono">—</span>
    <span class="status__sep">·</span>
    <span id="s-ver" class="mono">—</span>
  </div>
</footer>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
