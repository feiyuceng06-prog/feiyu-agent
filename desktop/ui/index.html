<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Feiyu</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css">
</head>
<body data-side="on">

<!-- 自绘标题栏。整条可拖动，按钮那几块单独排除掉。 -->
<header class="bar" data-tauri-drag-region>
  <div class="bar__left">
    <button id="side-toggle" class="chip" type="button" title="收起 / 展开侧边栏"
            aria-expanded="true" aria-controls="side">◧</button>
    <img class="bar__mark" src="logo.svg" alt="" width="18" height="18">
    <span class="bar__title">Feiyu</span>
  </div>
  <div class="bar__right">
    <button id="act-skills" class="chip" type="button" title="技能与命令">⌘</button>
    <button id="act-cost" class="chip" type="button" title="花费">¥</button>
    <button id="act-mode" class="chip" type="button" title="权限模式">⏸</button>
    <span class="bar__gap"></span>
    <button id="win-min" class="chip chip--win" type="button" title="最小化">─</button>
    <button id="win-max" class="chip chip--win" type="button" title="最大化">□</button>
    <button id="win-close" class="chip chip--win chip--close" type="button" title="关闭">✕</button>
  </div>
</header>

<aside class="side" id="side">
  <nav class="side__nav">
    <button class="nav" id="new-talk" type="button">
      <span class="nav__icon">＋</span><span class="nav__text">新建会话</span>
      <span class="nav__key">Ctrl N</span>
    </button>
    <button class="nav" id="nav-skills" type="button">
      <span class="nav__icon">▤</span><span class="nav__text">技能与命令</span>
    </button>
    <button class="nav" id="nav-jobs" type="button">
      <span class="nav__icon">▷</span><span class="nav__text">后台任务</span>
    </button>
    <button class="nav" id="nav-memory" type="button">
      <span class="nav__icon">◆</span><span class="nav__text">长期记忆</span>
    </button>
  </nav>

  <div class="side__find">
    <input id="find" type="search" placeholder="搜索会话…" spellcheck="false" autocomplete="off">
  </div>

  <div class="side__scroll">
    <div class="group" id="group-pinned" hidden>
      <div class="group__head">已置顶</div>
      <ul class="talks" id="pinned"></ul>
    </div>
    <div class="group">
      <div class="group__head">会话</div>
      <ul class="talks" id="talks"></ul>
    </div>
  </div>
</aside>

<main class="sheet" id="sheet">
  <div class="stream" id="stream"></div>
</main>

<footer class="composer">
  <ul class="clips" id="clips" hidden></ul>
  <div class="palette" id="palette" hidden></div>
  <div class="composer__row">
    <label class="chip chip--attach" title="上传文件到工作区">
      ＋<input id="file" type="file" multiple hidden>
    </label>
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off"
              placeholder="我们要做什么？"></textarea>
    <button id="model" class="pick" type="button" title="切换模型">—</button>
    <button id="send" class="go" type="button" title="发送">→</button>
    <button id="stop" class="go go--stop" type="button" title="中断" hidden>■</button>
  </div>
</footer>

<footer class="status">
  <div class="status__left">
    <span class="dot" id="dot" data-state="off"></span>
    <span id="s-state">连接中</span>
    <span class="status__sep">·</span>
    <span id="s-cwd" class="mono">—</span>
    <span class="status__sep" id="s-boot-sep" hidden>·</span>
    <span id="s-boot" hidden></span>
  </div>
  <div class="status__right">
    <span id="s-mode">—</span>
    <span class="status__sep">·</span>
    <span id="s-ctx" class="mono">—</span>
    <span class="status__sep">·</span>
    <span id="s-cost" class="mono">—</span>
    <span class="status__sep">·</span>
    <span id="s-ver" class="mono">—</span>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
